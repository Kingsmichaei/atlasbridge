[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasbridge"
version = "2.0.0"
description = "Python client for N-ATLaS (English, Hausa, Igbo, Yoruba) via an AtlasBridge gateway. Powered by Awarri."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]
license = { text = "MIT" }
authors = [{ name = "Michael" }]
classifiers = ["Programming Language :: Python :: 3", "Natural Language :: Hausa", "Natural Language :: English"]

[project.scripts]
atlasbridge = "atlasbridge.cli:main"

[tool.setuptools]
packages = ["atlasbridge"]
