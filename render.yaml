services:
  - type: web
    name: atlasbridge
    runtime: python
    plan: free
    # No rootDir: commands run from the repo root, so the build can reach both gateway/ and web/.
    # The website is built into web/dist, which the gateway serves at "/" (see gateway/app/web.py).
    buildCommand: cd gateway && pip install -r requirements.txt && cd ../web && npm ci --include=dev && npm run build
    startCommand: cd gateway && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - gateway/**
        - web/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: UPSTREAM_URL
        sync: false
      - key: UPSTREAM_KEY
        sync: false
      - key: UPSTREAM_FALLBACK_URL
        sync: false
      - key: UPSTREAM_FALLBACK_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: atlasbridge-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SIGNUP_CODE
        value: naic-beta
      - key: LOG_CONTENT
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"

databases:
  - name: atlasbridge-db
    plan: free
    databaseName: atlasbridge
