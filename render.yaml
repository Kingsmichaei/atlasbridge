services:
  - type: web
    name: atlasbridge
    runtime: python
    rootDir: gateway
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: UPSTREAM_URL
        sync: false
      - key: UPSTREAM_KEY
        sync: false
      - key: UPSTREAM_FALLBACK_URL
        sync: false
      - key: UPSTREAM_FALLBACK_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: atlasbridge-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SIGNUP_CODE
        value: naic-beta
      - key: LOG_CONTENT
        value: "1"

databases:
  - name: atlasbridge-db
    plan: free
    databaseName: atlasbridge
