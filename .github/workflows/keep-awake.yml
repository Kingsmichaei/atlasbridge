# Free hosts sleep when idle: Render after 15 min, Hugging Face Spaces after 48 h.
# Not needed for a paid Render instance (the live gateway), but harmless.
# This pings both so the gateway and the CPU backup stay reachable.
# Set the repository variables GATEWAY_URL and BACKUP_URL (Settings → Secrets and variables → Actions → Variables).
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping gateway
        if: ${{ vars.GATEWAY_URL != '' }}
        run: curl -fsS --max-time 90 "${{ vars.GATEWAY_URL }}/health" || true
      - name: Ping CPU backup
        if: ${{ vars.BACKUP_URL != '' }}
        run: curl -fsS --max-time 90 "${{ vars.BACKUP_URL }}/health" || true
