<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">AtlasBridge</title>
  <desc id="d">N-ATLaS for every developer, in Hausa, Igbo, Yoruba and English. An OpenAI-compatible API, Python SDK and live playground.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#05291a"/>
      <stop offset="0.55" stop-color="#0a6b3e"/>
      <stop offset="1" stop-color="#12a463"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="r"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- brand -->
    <g transform="translate(60 58) scale(0.75)" fill="#ffffff">
      <g transform="translate(15.83 3.20) scale(0.5053)"><path d="M0 0 L64 44 L0 66 Z M15 44.98 L30.97 39.49 L15 28.52 Z M0 68 H42 A22 22 0 0 1 42 112 H0 Z M15 83 V97 H42 A7 7 0 0 0 42 83 Z M0 51 H15 V114 H0 Z"/></g>
    </g>
    <text x="112" y="92" font-size="28" font-weight="700" fill="#ffffff">AtlasBridge</text>

    <text x="64" y="186" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">N-ATLaS for every developer</text>
    <text x="64" y="244" font-size="30" font-weight="700" fill="#f2b631">in Hausa, Igbo, Yoruba and English</text>
    <text x="64" y="296" font-size="21" fill="#d9efe3">OpenAI-compatible API · Python SDK · live playground</text>
    <text x="64" y="340" font-size="16" fill="#a9d3bc">Change one base_url and your app speaks Nigerian languages.</text>

    <!-- code card -->
    <g transform="translate(812 66)">
      <rect width="410" height="268" rx="16" fill="#04231a" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="24" cy="24" r="6" fill="#e5534b"/><circle cx="44" cy="24" r="6" fill="#f2b631"/><circle cx="64" cy="24" r="6" fill="#3fb950"/>
      <text x="390" y="29" text-anchor="end" font-size="13" fill="#7fae95" font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace">POST /v1/chat/completions</text>
      <g font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="15">
        <text x="24" y="76" fill="#7fae95">model: <tspan fill="#f2b631">"n-atlas"</tspan></text>
        <text x="24" y="118" fill="#7fae95">you</text>
        <text x="106" y="118" fill="#ffffff">Kedu ka ị mere?</text>
        <text x="24" y="152" fill="#12d47f">n-atlas</text>
        <text x="106" y="152" fill="#ffffff">Adị m mma, daalụ!</text>
        <text x="106" y="176" fill="#ffffff">Kedu maka gị?</text>
      </g>
      <g font-size="13" font-weight="600">
        <rect x="24" y="210" width="112" height="30" rx="15" fill="#0a7a45"/>
        <text x="80" y="230" text-anchor="middle" fill="#ffffff">detected: ig</text>
        <rect x="146" y="210" width="96" height="30" rx="15" fill="#0a7a45"/>
        <text x="194" y="230" text-anchor="middle" fill="#ffffff">reply: ig</text>
        <rect x="252" y="210" width="118" height="30" rx="15" fill="none" stroke="#12d47f"/>
        <text x="311" y="230" text-anchor="middle" fill="#12d47f">backend: gpu</text>
      </g>
    </g>
  </g>
</svg>
